<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0D14"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9D65F5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0M0 48V0" stroke="#1F1F2E" stroke-width="0.6" fill="none"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle top border glow -->
  <rect width="1200" height="2" fill="url(#accent)" opacity="0.6"/>

  <!-- Logo mark -->
  <g transform="translate(100, 100)">
    <path d="M40 4L76 22V58L40 76L4 58V22L40 4Z" stroke="url(#accent)" stroke-width="2" fill="none"/>
    <path d="M40 20L60 30V50L40 60L20 50V30L40 20Z" fill="url(#accent)" opacity="0.25"/>
    <circle cx="40" cy="40" r="10" fill="url(#accent)"/>
  </g>

  <!-- Site name -->
  <text x="100" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700"
    letter-spacing="4" text-transform="uppercase" fill="#A1A1AA" opacity="0.7">AI TOOLS INDIA</text>

  <!-- Main headline -->
  <text x="100" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900"
    letter-spacing="-2" fill="#F8F8F8">Best Free AI Tools</text>
  <text x="100" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900"
    letter-spacing="-2">
    <tspan fill="url(#accent)">for India 2026</tspan>
  </text>

  <!-- Subline -->
  <text x="100" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="26" fill="#71717A">
    37+ tools reviewed • India pricing • Honest ratings
  </text>

  <!-- Right side decorative stat blocks -->
  <g transform="translate(820, 140)">
    <!-- Card 1 -->
    <rect width="260" height="100" rx="12" fill="#111116" stroke="#1F1F2E" stroke-width="1"/>
    <text x="24" y="42" font-family="system-ui" font-size="36" font-weight="900" fill="#F8F8F8">37+</text>
    <text x="24" y="68" font-family="system-ui" font-size="16" fill="#52525B">Tools Listed</text>

    <!-- Card 2 -->
    <rect y="120" width="260" height="100" rx="12" fill="#111116" stroke="#1F1F2E" stroke-width="1"/>
    <text x="24" y="162" font-family="system-ui" font-size="36" font-weight="900" fill="#22C55E">10+</text>
    <text x="24" y="188" font-family="system-ui" font-size="16" fill="#52525B">Free Forever</text>

    <!-- Card 3 -->
    <rect y="240" width="260" height="100" rx="12" fill="#111116" stroke="#7C3AED40" stroke-width="1"/>
    <text x="24" y="282" font-family="system-ui" font-size="36" font-weight="900" fill="#C4B5FD">🇮🇳 India</text>
    <text x="24" y="308" font-family="system-ui" font-size="16" fill="#52525B">Focused Reviews</text>
  </g>

  <!-- URL -->
  <text x="100" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#3F3F46">
    bestaitools.in
  </text>
</svg>
